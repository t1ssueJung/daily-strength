<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f6f3ea">
<meta name="description" content="이름을 입력하고 하루 10분 근력운동을 기록해 보세요.">
<title>하루 10분 근력운동 체크</title>
<style>
:root{color-scheme:light;--paper:#f6f3ea;--card:#fffdf8;--ink:#17243b;--muted:#555e6d;--line:#dad8ce;--green:#18263f;--lime:#ffdc64;--soft:#f4eee0}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Malgun Gothic",sans-serif;word-break:keep-all}
button,input{font:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid #b7442e;outline-offset:3px}
.wrap{width:min(100% - 36px,920px);margin-inline:auto}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:78px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;white-space:nowrap}
.brand-icon{display:grid;place-items:center;width:36px;height:36px;border-radius:12px;background:var(--green);color:var(--lime)}
.date{color:var(--muted);font-size:.83rem;text-align:right}
.hero{position:relative;isolation:isolate;overflow:hidden;min-height:286px;display:flex;align-items:center;padding:38px clamp(25px,6vw,57px);background:#f9edcf;color:#17243b;border:2px solid var(--ink);box-shadow:5px 5px 0 var(--ink);border-radius:24px}
.hero-copy{position:relative;z-index:1}
.eyebrow{margin:0 0 12px;font-size:.72rem;font-weight:800;letter-spacing:.17em}
.hero .eyebrow{color:#a43b28}
h1,h2,p{margin-top:0}
h1{margin-bottom:15px;font-size:clamp(2.05rem,6vw,4rem);line-height:1.08;letter-spacing:-.07em}
h1 span{color:#b7442e}
.hero-copy>p:last-child{margin:0;color:#555e6d;font-size:.93rem}
.hero-art{position:absolute;right:0;bottom:-21px;width:min(50%,380px);height:auto;color:#d57835;pointer-events:none}
.dashboard{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin:23px 0 0}
.panel{min-width:0;padding:26px;background:var(--card);border:1.5px solid var(--ink);border-radius:20px}
.panel .eyebrow{color:#a43b28;margin-bottom:7px}
h2{margin-bottom:7px;font-size:1.43rem;line-height:1.24;letter-spacing:-.045em;overflow-wrap:anywhere}
.hint{font-size:.87rem;color:var(--muted);margin-bottom:18px}
label{display:block;margin-bottom:6px;font-weight:750;font-size:.86rem}
.form-row{display:flex;gap:8px}
input{min-width:0;width:100%;height:48px;border:1px solid #b5beb0;border-radius:10px;background:#fff;color:var(--ink);padding:0 11px}
.primary{min-height:48px;padding:0 15px;border:1px solid var(--green);border-radius:10px;background:var(--green);color:white;font-weight:750;white-space:nowrap}
.primary:hover{background:#293e5f}
.change{padding:4px 0;border:0;background:none;color:var(--green);font-weight:750;text-decoration:underline;text-underline-offset:3px}
.profile-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.profile-top h2{min-width:0}
.check{display:flex;align-items:center;justify-content:center;gap:9px;min-height:53px;width:100%;border:1px solid transparent;border-radius:12px;background:var(--lime);color:var(--ink);font-weight:850}
.check:hover{background:#f7cb42}
.check[aria-pressed=true]{background:#fff1c0;border-color:#c58f26;color:#563a10}
.check[aria-pressed=true]:hover{background:#ffe69b}
.status{margin:8px 0 0;color:var(--muted);font-size:.82rem}
.status:empty{margin:0}
.summary{display:flex;align-items:start;justify-content:space-between;gap:8px}
.count{display:inline-block;padding:3px 9px;border-radius:99px;background:var(--soft);color:var(--green);font-size:.79rem;font-weight:800;white-space:nowrap}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px;list-style:none;margin:17px 0 0;padding:0}
.day{display:grid;justify-items:center;gap:3px;padding:6px 0;border:1px solid transparent;border-radius:10px;background:var(--soft);color:var(--muted);font-size:.72rem}
.day b{font-size:.86rem;color:var(--ink);font-variant-numeric:tabular-nums}
.day.today{border-color:#ae4b33}
.day.done{background:var(--lime);color:var(--green)}
.legend{display:flex;justify-content:space-between;gap:8px;margin:9px 0 0;color:var(--muted);font-size:.72rem}
footer{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:17px 3px 30px;color:var(--muted);font-size:.78rem}
footer p{margin:0}
@media(max-width:680px){
header{min-height:62px}
.hero{min-height:239px;padding-block:26px}
.hero-art{right:-20px;bottom:-10px;width:53%;opacity:.55}
.dashboard{grid-template-columns:1fr;gap:11px;margin-top:17px}
.panel{padding:20px}
footer{display:block}
footer p+p{margin-top:5px}
}
@media(max-width:360px){.wrap{width:calc(100% - 24px)}.panel{padding:15px}.form-row{flex-wrap:wrap}.form-row button{width:100%}.week{gap:3px}}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div class="brand"><span class="brand-icon" aria-hidden="true"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M2 12h3m14 0h3M8 12h8M5 8v8m3-10v12M16 6v12m3-10v8"/></svg></span>10분 근력운동</div>
  <time class="date" id="header-date"></time>
</header>
<main>
  <section class="hero" aria-labelledby="title">
    <div class="hero-copy">
      <p class="eyebrow">DAILY STRENGTH CLUB</p>
      <h1 id="title">하루 10분,<br><span>근력운동 체크</span></h1>
      <p>운동을 마친 날에 체크 하나를 남겨요.</p>
    </div>
    <svg class="hero-art" aria-hidden="true" viewBox="0 0 420 330" fill="none">
      <circle cx="260" cy="195" r="139" stroke="currentColor" stroke-opacity=".28"/>
      <circle cx="260" cy="195" r="165" stroke="currentColor" stroke-opacity=".15"/>
      <g transform="rotate(-30 259 177)" stroke="#18263f" stroke-width="3" stroke-linejoin="round">
        <path d="M183 165h150v25H183z" fill="#e79450"/>
        <path d="M132 168h24v19h-24zM365 168h20v19h-20z" fill="#e79450"/>
        <rect x="152" y="133" width="35" height="89" rx="13" fill="#f1b852"/>
        <rect x="178" y="115" width="46" height="125" rx="15" fill="#ffdc64"/>
        <rect x="294" y="115" width="46" height="125" rx="15" fill="#ffdc64"/>
        <rect x="332" y="133" width="35" height="89" rx="13" fill="#f1b852"/>
        <path d="M192 136v78m116-78v78m38-63v50m-180-50v50" stroke="#18263f" stroke-opacity=".45" stroke-linecap="round"/>
      </g>
      <path d="M302 38v27m-13-14h26M110 249v19m-9-9h18M365 214v20m-10-10h20" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      <circle cx="156" cy="96" r="3" fill="currentColor"/><circle cx="272" cy="278" r="3" fill="currentColor"/>
    </svg>
  </section>
  <div class="dashboard">
    <section class="panel" aria-labelledby="check-heading">
      <p class="eyebrow">01 / 오늘의 체크</p>
      <div class="profile-top">
        <h2 id="check-heading" tabindex="-1">이름을 입력해 주세요</h2>
        <button class="change" type="button" id="change" hidden>이름 바꾸기</button>
      </div>
      <p class="hint" id="check-hint">같은 브라우저에서 같은 이름으로 기록을 이어갈 수 있어요.</p>
      <form id="profile-form">
        <label for="name">이름</label>
        <div class="form-row">
          <input id="name" placeholder="예: 김하늘" maxlength="30" autocomplete="off" required>
          <button class="primary" type="submit">시작하기</button>
        </div>
      </form>
      <button class="check" type="button" id="check" aria-label="오늘 운동 완료" aria-pressed="false" hidden>
        <span id="check-icon" aria-hidden="true">＋</span><span id="check-label">오늘 운동 완료</span>
      </button>
      <p class="status" id="status" role="status"></p>
    </section>
    <section class="panel" aria-labelledby="week-heading">
      <p class="eyebrow">02 / 나의 기록</p>
      <div class="summary"><h2 id="week-heading">최근 7일</h2><span class="count" id="count" hidden></span></div>
      <p class="hint" id="week-hint">이름을 입력하면 내 기록이 보여요.</p>
      <ul class="week" id="week" aria-label="최근 7일 운동 기록"></ul>
      <p class="legend"><span>✓ 운동 완료</span><span>테두리 표시 · 오늘</span></p>
    </section>
  </div>
</main>
<footer><p>이름과 운동 기록은 현재 브라우저에만 저장돼요.</p><p>하루의 기준 · 한국 시간</p></footer>
<noscript>운동 기록을 사용하려면 브라우저에서 자바스크립트를 켜 주세요.</noscript>
</div>
<script>
'use strict';

const byId = (id) => document.getElementById(id);
const headerDate = byId('header-date');
const form = byId('profile-form');
const nameInput = byId('name');
const heading = byId('check-heading');
const hint = byId('check-hint');
const changeButton = byId('change');
const checkButton = byId('check');
const status = byId('status');
const week = byId('week');
const weekHint = byId('week-hint');
const count = byId('count');

const prefix = 'daily-strength-10:v1:' + location.pathname.replace(/index\.html$/, '') + ':';
const activeKey = prefix + 'active';
const nameKey = (name) => prefix + 'profile:' + name;
const timezone = 'Asia/Seoul';
const iso = new Intl.DateTimeFormat('en-CA', { timeZone: timezone, year: 'numeric', month: '2-digit', day: '2-digit' });
const fullDate = new Intl.DateTimeFormat('ko-KR', { timeZone: 'UTC', year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' });
const weekday = new Intl.DateTimeFormat('ko-KR', { timeZone: 'UTC', weekday: 'short' });
const normalizeName = (value) => value.normalize('NFC').trim().replace(/\s+/g, ' ');
const dateKey = (date) => date.toISOString().slice(0, 10);

let name = '';
let renderedDate = '';

function todayKey() {
  const parts = Object.fromEntries(iso.formatToParts().map(({ type, value }) => [type, value]));
  return parts.year + '-' + parts.month + '-' + parts.day;
}

function checkedDays() {
  if (!name) return new Set();
  const raw = localStorage.getItem(nameKey(name));
  if (raw === null) return new Set();
  const stored = JSON.parse(raw);
  if (!Array.isArray(stored)) throw new Error('Invalid workout records');
  return new Set(stored.filter((value) => typeof value === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(value)));
}

function render() {
  const today = todayKey();
  const date = new Date(today + 'T00:00:00Z');
  renderedDate = today;
  headerDate.dateTime = today;
  headerDate.textContent = fullDate.format(date);
  form.hidden = Boolean(name);
  checkButton.hidden = !name;
  changeButton.hidden = !name;
  heading.textContent = name ? name + '님의 운동 기록' : '이름을 입력해 주세요';

  let checked;
  try {
    checked = checkedDays();
    checkButton.disabled = false;
  } catch {
    checked = new Set();
    checkButton.disabled = true;
    status.textContent = '저장된 기록을 불러올 수 없어요.';
  }

  const doneToday = checked.has(today);
  hint.textContent = name
    ? (doneToday ? '오늘 운동을 기록했어요. 다시 누르면 취소돼요.' : '오늘 10분 운동을 마쳤다면 아래 버튼을 눌러 주세요.')
    : '같은 브라우저에서 같은 이름으로 기록을 이어갈 수 있어요.';
  checkButton.setAttribute('aria-pressed', String(doneToday));
  byId('check-icon').textContent = doneToday ? '✓' : '＋';
  byId('check-label').textContent = doneToday ? '오늘 운동 완료됨 · 취소' : '오늘 운동 완료';

  const days = document.createDocumentFragment();
  let total = 0;
  for (let offset = 6; offset >= 0; offset--) {
    const day = new Date(date);
    day.setUTCDate(day.getUTCDate() - offset);
    const done = checked.has(dateKey(day));
    if (done) total++;
    const cell = document.createElement('li');
    cell.classList.add('day');
    if (done) cell.classList.add('done');
    if (offset === 0) cell.classList.add('today');
    const label = name ? (done ? '완료' : '미완료') : '이름 입력 전';
    cell.setAttribute('aria-label', fullDate.format(day) + (offset === 0 ? ', 오늘' : '') + ', ' + label);
    const dayNumber = document.createElement('b');
    dayNumber.textContent = day.getUTCDate();
    const marker = document.createElement('span');
    marker.textContent = done ? '✓' : '·';
    cell.append(weekday.format(day), dayNumber, marker);
    days.append(cell);
  }
  week.replaceChildren(days);
  count.hidden = !name || checkButton.disabled;
  count.textContent = total + ' / 7일 완료';
  weekHint.textContent = name ? '오늘을 포함한 최근 일주일이에요.' : '이름을 입력하면 내 기록이 보여요.';
}

form.addEventListener('submit', (event) => {
  event.preventDefault();
  const enteredName = normalizeName(nameInput.value);
  if (!enteredName) {
    status.textContent = '이름을 입력해 주세요.';
    nameInput.focus();
    return;
  }
  try {
    localStorage.setItem(activeKey, enteredName);
  } catch {
    status.textContent = '이 브라우저에서 기록을 저장할 수 없어요. 브라우저의 저장 설정을 확인해 주세요.';
    return;
  }
  name = enteredName;
  status.textContent = '';
  render();
  heading.focus();
});

changeButton.addEventListener('click', () => {
  try {
    localStorage.removeItem(activeKey);
  } catch {
    status.textContent = '현재 이름을 바꿀 수 없어요.';
    return;
  }
  name = '';
  nameInput.value = '';
  status.textContent = '';
  render();
  nameInput.focus();
});

checkButton.addEventListener('click', () => {
  const today = todayKey();
  if (today !== renderedDate) {
    render();
    status.textContent = '날짜가 바뀌었어요. 오늘 날짜를 확인하고 다시 눌러 주세요.';
    return;
  }
  try {
    const checked = checkedDays();
    const wasDone = checked.delete(today);
    if (!wasDone) checked.add(today);
    localStorage.setItem(nameKey(name), JSON.stringify([...checked]));
    render();
    status.textContent = wasDone ? '오늘 체크를 취소했어요.' : '오늘 체크를 저장했어요.';
  } catch {
    status.textContent = '체크를 저장할 수 없어요. 잠시 후 다시 시도해 주세요.';
  }
});

function refreshDate() {
  if (todayKey() !== renderedDate) {
    status.textContent = '';
    render();
  }
}
document.addEventListener('visibilitychange', refreshDate);
window.addEventListener('pageshow', refreshDate);
window.addEventListener('storage', (event) => {
  if (name && (event.key === nameKey(name) || event.key === null)) {
    status.textContent = '';
    render();
  }
});
setInterval(refreshDate, 15000);

try {
  name = localStorage.getItem(activeKey) || '';
} catch {
  status.textContent = '이 브라우저의 저장 공간을 사용할 수 없어요.';
}
render();
</script>
</body>
</html>
